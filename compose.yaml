services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env
    init: true
    gpus: all
    shm_size: "2gb"
    ports:
      - "127.0.0.1:8000:8000"
    networks:
      - app_network
    volumes:
      - ./local-assets/runtime-models:/models:ro
      - ./local-assets/sample-bundle/data:/samples:ro
      - ./local-assets/deployment:/deployment:ro
      - ./runtime:/runtime
    restart: unless-stopped

networks:
  app_network:
    driver: bridge
