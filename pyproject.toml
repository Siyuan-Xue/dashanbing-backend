[project]
name = "dashanbing-backend"
version = "0.1.0"
description = "Local four-camera basketball training review product"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi[standard]",
    "sqlmodel",
    "pyjwt",
    "pwdlib[argon2]",
    "pydantic-settings",
    "alembic",
    "numpy>=1.24,<2",
    "opencv-python-headless>=4.8",
    "pyyaml>=6",
]

[dependency-groups]
dev = [
    "pytest",
]

[tool.fastapi]
entrypoint = "app.main:app"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
filterwarnings = [
    "ignore:Using `httpx` with `starlette.testclient` is deprecated:starlette.exceptions.StarletteDeprecationWarning",
]
